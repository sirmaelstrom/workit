# gitleaks config for workit
# Extends the built-in ruleset; adds an allowlist for known synthetic values.
title = "workit gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Synthetic placeholder values used in eval fixtures and recorded eval outputs — not real secrets."
# 987654321098765432 is the canonical fake Discord snowflake used in example
# scenarios (appears in skills/diagnose/evals/* outputs, current and historical).
regexes = [
  '''987654321098765432''',
]
# The operator-proof vectors (credential ids, SPKI keys, signatures) and the JWK
# keys in test-signer.mjs are synthetic test keys, generated for the tests and
# trusted by no anchor outside them.
paths = [
  '''skills/_shared/operator-proof/operator-proof\.vectors\.json''',
  '''skills/_shared/operator-proof/test-signer\.mjs''',
]
